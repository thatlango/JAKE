services:
  db:
    image: postgres:17-alpine
    container_name: jakeos-db
    restart: unless-stopped
    env_file:
      - /opt/tuku/secrets/jakeos.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jakeos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jakeos}
    volumes:
      - jakeos_postgres_data:/var/lib/postgresql/data
    networks: [jakeos-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: jakeos:local
    container_name: jakeos-web
    restart: unless-stopped
    env_file:
      - /opt/tuku/secrets/jakeos.env
      - /opt/tuku/secrets/estate-product-telemetry.env
      - /opt/tuku/secrets/jakeos-tukupay.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-jakeos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jakeos}
      JAKEOS_AI_ENABLED: ${JAKEOS_AI_ENABLED:-true}
      JAKEOS_AI_MODEL: ${JAKEOS_AI_MODEL:-qwen3:1.7b}
      JAKEOS_AGENT_LOCAL_WORKER_ENABLED: ${JAKEOS_AGENT_LOCAL_WORKER_ENABLED:-true}
      JAKEOS_AGENT_LOCAL_WORKER_INTERVAL_MS: ${JAKEOS_AGENT_LOCAL_WORKER_INTERVAL_MS:-10000}
      OPENAI_ERRAND_ENABLED: ${OPENAI_ERRAND_ENABLED:-true}
      OPENAI_ERRAND_MODEL: ${OPENAI_ERRAND_MODEL:-gpt-5.6-terra}
      OPENAI_ERRAND_INTERVAL_MS: ${OPENAI_ERRAND_INTERVAL_MS:-10000}
      OPENAI_ERRAND_DEFAULT_MAX_COST_USD: ${OPENAI_ERRAND_DEFAULT_MAX_COST_USD:-2}
      OPENAI_ERRAND_DEFAULT_MAX_TOOL_CALLS: ${OPENAI_ERRAND_DEFAULT_MAX_TOOL_CALLS:-24}
      JAKEOS_GOOGLE_WORKSPACE_EXTENDED: ${JAKEOS_GOOGLE_WORKSPACE_EXTENDED:-true}
      TUKU_CORE_INTERNAL_URL: ${TUKU_CORE_INTERNAL_URL:-http://tuku-core-api:3000}
    volumes:
      - /opt/tuku/secrets/jakeos-ai.key:/run/secrets/tuku-ai-key:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jakeos-internal
      - tuku-bridge
      - tuku-edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  jakeos_postgres_data:

networks:
  jakeos-internal:
    name: jakeos-internal
  tuku-bridge:
    external: true
    name: tuku-bridge
  tuku-edge:
    external: true
    name: tuku-edge
