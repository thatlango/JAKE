services:
  jakeos-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jakeos
      POSTGRES_USER: jakeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - jakeos_pgdata:/var/lib/postgresql/data
    networks:
      - jakeos-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jakeos -d jakeos"]
      interval: 10s
      timeout: 5s
      retries: 10

  jakeos-web:
    build: .
    restart: unless-stopped
    env_file:
      - ${JAKEOS_ENV_FILE:-/opt/tuku/secrets/jakeos.env}
    environment:
      DATABASE_URL: postgresql://jakeos:${POSTGRES_PASSWORD}@jakeos-db:5432/jakeos
    depends_on:
      jakeos-db:
        condition: service_healthy
    networks:
      - jakeos-internal
      - tuku-edge

volumes:
  jakeos_pgdata:

networks:
  jakeos-internal:
    internal: true
  tuku-edge:
    external: true
