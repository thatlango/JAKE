name: Estate Control CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: estate-control-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install server dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate server and tests
        run: npm run check
      - name: Install client dependencies
        run: npm ci --prefix client --no-audit --no-fund
      - name: Build client
        run: npm run build
